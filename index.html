<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي القدرات اللفظي - أ/ عبدالعزيز الفيفي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --main-color: #2c3e50; --bg-color: #f4f7f6; --white: #ffffff; --correct: #27ae60; --wrong: #e74c3c; --passage-bg: rgba(0,0,0,0.03); }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; padding: 20px; margin: 0; user-select: none; transition: background 0.5s; }
        .quiz-card { background: var(--white); width: 100%; max-width: 900px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.08); border-top: 12px solid var(--main-color); padding: 35px; }
        .header { text-align: center; border-bottom: 2px solid #f0f0f0; margin-bottom: 25px; padding-bottom: 15px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.02); padding: 15px 25px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #eee; }
        .q-type-badge { background: var(--main-color); color: white; padding: 8px 20px; border-radius: 8px; font-weight: bold; }
        .q-text { font-size: 1.5rem; font-weight: bold; text-align: center; line-height: 1.8; color: #2c3e50; margin: 20px 0; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt { padding: 18px; border: 2px solid #ecf0f1; border-radius: 12px; cursor: pointer; text-align: center; font-size: 1.2rem; font-weight: 600; transition: 0.2s; background: #fff; }
        .opt:hover { border-color: var(--main-color); background: #f9fbfb; }
        .correct { background: var(--correct) !important; color: white !important; border-color: var(--correct) !important; }
        .wrong { background: var(--wrong) !important; color: white !important; border-color: var(--wrong) !important; }
        .btn { background: var(--main-color); color: white; padding: 15px 40px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        .hidden { display: none !important; }
        input { width: 80%; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; text-align: center; font-size: 1.1rem; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h3>ثانوية الأمير عبدالمجيد 🎓</h3>
        <h4>أ / عبدالعزيز الفيفي ✨</h4>
    </div>

    <div id="lock-screen" class="hidden" style="text-align: center; padding: 40px;">
        <h1 style="font-size: 4rem; margin: 0;">🚫</h1>
        <h2 style="color: var(--wrong);">عذراً.. لا يمكنك الدخول</h2>
        <div id="lock-message" style="font-size: 1.3rem; line-height: 1.6; color: #555; margin-bottom: 25px;"></div>
        <a href="https://aztlaztl1512-bit.github.io/MAHME-/" class="btn">انتقل لتحدي آخر ⮕</a>
    </div>

    <div id="start-page" style="text-align: center;">
        <input type="email" id="studentEmail" placeholder="أدخل إيميل منصة مدرستي لبدء التحدي">
        <br>
        <button class="btn" onclick="verifyAndStart()">دخول المنصة 🚀</button>
        <p id="status-msg" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <div id="quiz-page" class="hidden">
        <div class="nav-bar">
            <div id="q-counter" style="font-weight: bold;"></div>
            <div id="timer" style="font-weight: 900; font-size: 1.5rem; color: var(--wrong);">45</div>
        </div>
        <div style="text-align: center; margin-bottom: 15px;"><span id="q-type-label" class="q-type-badge"></span></div>
        <div id="question-text" class="q-text"></div>
        <div id="options-area" class="options-grid"></div>
        <div style="text-align: center; margin-top: 35px;">
            <button id="next-btn" class="btn hidden" onclick="nextQuestion()">السؤال التالي ⮕</button>
        </div>
    </div>

    <div id="result-page" class="hidden" style="text-align: center;">
        <h2 id="final-greeting"></h2>
        <div style="font-size: 4.5rem; font-weight: bold; margin: 20px 0; color: var(--main-color);" id="score-text"></div>
        <button class="btn" onclick="location.reload()">خروج</button>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0", 
        authDomain: "aztlg-494c3.firebaseapp.com", 
        projectId: "aztlg-494c3", 
        storageBucket: "aztlg-494c3.firebasestorage.app", 
        messagingSenderId: "597051893949", 
        appId: "1:597051893949:web:de5554ac900317a92b2fd4" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const themes = [
        {main: "#800000", bg: "#fdf1f1", pbg: "rgba(128, 0, 0, 0.05)"},
        {main: "#2c3e50", bg: "#f4f7f6", pbg: "rgba(44, 62, 80, 0.05)"},
        {main: "#1e3a8a", bg: "#eff6ff", pbg: "rgba(30, 58, 138, 0.05)"},
        {main: "#065f46", bg: "#ecfdf5", pbg: "rgba(6, 95, 70, 0.05)"},
        {main: "#b45309", bg: "#fffbeb", pbg: "rgba(180, 83, 9, 0.05)"},
        {main: "#6d28d9", bg: "#f5f3ff", pbg: "rgba(109, 40, 217, 0.05)"}
    ];
    const theme = themes[Math.floor(Math.random() * themes.length)];
    document.documentElement.style.setProperty('--main-color', theme.main);
    document.documentElement.style.setProperty('--bg-color', theme.bg);

    const rawQuizData = [
        { t: "تناظر لفظي", q: "غرفة : فندق", opts: ["غصن : شجرة", "شارع : مدينة", "وجه : أنف", "بحر : سمك"], ans: "غصن : شجرة" },
        { t: "تناظر لفظي", q: "رمل : زجاج", opts: ["خشب : ورق", "حديد : مغناطيس", "ماء : ثلج", "نار : دخان"], ans: "خشب : ورق" },
        { t: "تناظر لفظي", q: "دقيقة : ساعة", opts: ["يوم : أسبوع", "ثانية : دقيقة", "شهر : سنة", "قرن : عام"], ans: "ثانية : دقيقة" },
        { t: "تناظر لفظي", q: "منحل : عسل", opts: ["مزرعة : ثمار", "حقل : قمح", "فرن : خبز", "بحر : لؤلؤ"], ans: "فرن : خبز" },
        { t: "تناظر لفظي", q: "مهندس : خريطة", opts: ["طبيب : مستشفى", "محام : قضية", "خياط : قماش", "رسام : لوحة"], ans: "رسام : لوحة" },
        { t: "تناظر لفظي", q: "عجين : خبز", opts: ["ماء : ثلج", "نواة : تمر", "خشب : كرسي", "بذرة : شجرة"], ans: "خشب : كرسي" },
        { t: "تناظر لفظي", q: "منار : إرشاد", opts: ["مفتاح : غلق", "ساعة : وقت", "بوصلة : اتجاه", "قلم : كتابة"], ans: "بوصلة : اتجاه" },
        { t: "تناظر لفظي", q: "اجتهاد : نجاح", opts: ["ركض : تعب", "ألم : مرض", "نوم : ليل", "سفر : حقيبة"], ans: "ركض : تعب" },
        { t: "تناظر لفظي", q: "غزال : رشاقة", opts: ["أسد : قوة", "ثعلب : مكر", "جمل : صبر", "نملة : نظام"], ans: "ثعلب : مكر" },
        { t: "تناظر لفظي", q: "مشرط : جراح", opts: ["قلم : كاتب", "منشار : خشب", "طائرة : طيار", "مقص : قماش"], ans: "قلم : كاتب" },
        { t: "إكمال الجمل", q: "المتوكل هو الذي ...... بالأسباب و...... على رب الأرباب.", opts: ["يأخذ - يتوكل", "يترك - يعتمد", "ينسى - يرضى", "يهمل - يثق"], ans: "يأخذ - يتوكل" },
        { t: "إكمال الجمل", q: "من وعظ أخاه ...... فقد زانه، ومن وعظه ...... فقد شانه.", opts: ["سراً - علانية", "جهراً - سراً", "دائماً - يوماً", "بأدب - بغلظة"], ans: "سراً - علانية" },
        { t: "إكمال الجمل", q: "إذا كنت تحب الصعود فلا بد أن ...... عن ذرات ...... .", opts: ["تتخلى - الغرور", "تبحث - النجاح", "تدافع - الكرامة", "تتحدث - الفخر"], ans: "تتخلى - الغرور" },
        { t: "إكمال الجمل", q: "الكلمة الطيبة ...... للأبواب المغلقة، و...... للقلوب القاسية.", opts: ["مفتاح - بلسم", "قفل - وجع", "طريق - جدار", "حل - ألم"], ans: "مفتاح - بلسم" },
        { t: "إكمال الجمل", q: "الكتب هي ...... التي نطل من خلالها على ...... الآخرين.", opts: ["النوافذ - عقول", "الأبواب - بيوت", "المرآة - وجوه", "المصابيح - طرق"], ans: "النوافذ - عقول" },
        { t: "إكمال الجمل", q: "إذا أردت أن تعلو فوق الناس فضع نفسك ...... ، وإذا أردت أن تقودهم فسر ...... .", opts: ["أسفل منهم - خلفهم", "أمامهم - بجانبهم", "خلفهم - معهم", "فوقهم - أمامهم"], ans: "أسفل منهم - خلفهم" },
        { t: "إكمال الجمل", q: "عظمة عقلك تخلق لك ...... ، وعظمة قلبك تخلق لك ...... .", opts: ["الحساد - المحبين", "المجد - الحب", "الشهرة - المودة", "الأعداء - الأصدقاء"], ans: "الحساد - المحبين" },
        { t: "إكمال الجمل", q: "من ...... في عمله ساد، ومن ...... في قوله قاد.", opts: ["أخلص - صدق", "أسرع - أجمل", "تعب - أطال", "اجتهد - أكثر"], ans: "أخلص - صدق" },
        { t: "إكمال الجمل", q: "الاعتذار لا يعني دائماً أنك على ...... ، بل يعني أنك تقدّر ...... أكثر من ذاتك.", opts: ["خطأ - علاقتك", "حق - كرامتك", "يقين - نفسك", "باطل - قيمتك"], ans: "خطأ - علاقتك" },
        { t: "إكمال الجمل", q: "قطرة الماء ...... الصخر، ليس بالعنف ولكن بـ ...... .", opts: ["تفتت - التكرار", "تكسر - القوة", "تذيب - الحرارة", "تثقب - الصمود"], ans: "تفتت - التكرار" },
        { t: "الخطأ السياقي", q: "من لانت كلمته وجبت محبته، فالكلمة الفظة تفتح القلوب القاسية.", opts: ["لانت", "محبته", "الفظة", "تفتح"], ans: "تفتح" },
        { t: "الخطأ السياقي", q: "المرء الناجح هو من يغلق أذنيه عن النجاح، ويستمر في العمل الدؤوب.", opts: ["الناجح", "يغلق", "النجاح", "الدؤوب"], ans: "النجاح" },
        { t: "الخطأ السياقي", q: "الكتب هي خزائن العلم، فاحرص على إهمالها لتنال المعرفة الواسعة.", opts: ["خزائن", "احرص", "إهمالها", "المعرفة"], ans: "إهمالها" },
        { t: "الخطأ السياقي", q: "أفضل وسيلة للتغلب على الصعوبات هي الهروب منها، فالمواجهة تضعف العزيمة.", opts: ["أفضل", "الهروب", "المواجهة", "تضعف"], ans: "الهروب" },
        { t: "الخطأ السياقي", q: "إن طول التجارب في الحياة يعلمك كثرة الكلام، ويمنحك قدرة على الحكمة.", opts: ["طول", "يعلمك", "الكلام", "الحكمة"], ans: "الكلام" },
        { t: "الخطأ السياقي", q: "الرجل الصالح هو من يرى محاسن الناس ويخفي عيوبهم، ويذكر المساوئ في غيبتهم.", opts: ["الصالح", "محاسن", "عيوبهم", "المساوئ"], ans: "المساوئ" },
        { t: "الخطأ السياقي", q: "من أراد أن يطاع، فليأمر بما لا يستطاع.", opts: ["أراد", "يطاع", "فليأمر", "يستطاع"], ans: "يستطاع" },
        { t: "الخطأ السياقي", q: "نور الشمس يضيء النهار، ونور العلم يطفي القلوب.", opts: ["نور", "يضيء", "يطفي", "القلوب"], ans: "يطفي" },
        { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["خروف", "بقرة", "ماعز", "أسد"], ans: "أسد" },
        { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["الكويت", "البحرين", "الأردن", "عمان"], ans: "الأردن" },
        { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["سبت", "أحد", "محرم", "جمعة"], ans: "محرم" },
        { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["متر", "جرام", "كيلو", "طن"], ans: "متر" },
        { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["شمال", "شرق", "فوق", "غرب"], ans: "فوق" },
        { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["فقه", "توحيد", "كيمياء", "تفسير"], ans: "كيمياء" },
        { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["سيف", "خنجر", "رمح", "درع"], ans: "درع" },
        { t: "الارتباط والاختلاف", q: "الارتباط الأقوى لـ (مكّة) هو:", opts: ["جبل", "تجارة", "كعبة", "طريق"], ans: "كعبة" },
        { t: "الارتباط والاختلاف", q: "ما الكلمة التي لا تنتمي لمجموعة (أعضاء النطق):", opts: ["لسان", "أسنان", "حلق", "أذن"], ans: "أذن" },
        { t: "الارتباط والاختلاف", q: "أي من هذه الكلمات يختلف عن البقية:", opts: ["عطارد", "المريخ", "الشمس", "المشتري"], ans: "الشمس" },
        { t: "الارتباط والاختلاف", q: "الارتباط الأقوى لـ (غابة) هو:", opts: ["خشب", "أشجار", "حيوانات", "ماء"], ans: "أشجار" },
        { t: "الارتباط والاختلاف", q: "الكلمة المرتبطة بـ (بحر) من حيث المهنة:", opts: ["قبطان", "مهندس", "طيار", "مزارع"], ans: "قبطان" }
    ];

    const currentModelId = "نموذج-شامل-40";
    let sName, sEmail, currentIdx = 0, userScore = 0, timer, finalQuestions, studentAnswers = [];

    async function verifyAndStart() {
        const email = document.getElementById('studentEmail').value.trim().toLowerCase();
        if(!email.includes('@')) return alert("يرجى إدخال إيميل منصة مدرستي");
        document.getElementById('status-msg').innerText = "جاري التحقق... ⏳";
        
        try {
            // 1. التحقق من وجود الطالب في القائمة
            const doc = await db.collection("allowed_students").doc(email).get();
            if(!doc.exists) { alert("هذا الإيميل غير مسجل لدينا."); return; }
            sName = doc.data().name; sEmail = email;

            // 2. ميزة الإغلاق: التحقق إذا كان الطالب قد أدى هذا النموذج مسبقاً
            const check = await db.collection("student_results")
                            .where("email", "==", sEmail)
                            .where("model_id", "==", currentModelId).get();
            
            if(!check.empty) {
                document.getElementById('start-page').classList.add('hidden');
                document.getElementById('lock-screen').classList.remove('hidden');
                document.getElementById('lock-message').innerText = `يا ${sName}، لقد سبق لك خوض هذا التحدي بنجاح. لا يسمح بالتكرار لضمان دقة النتائج.`;
                return;
            }

            finalQuestions = [...rawQuizData].sort(() => Math.random() - 0.5);
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            loadQuestion();
        } catch(e) { alert("عذراً، فشل الاتصال بقاعدة البيانات."); }
    }

    function loadQuestion() {
        if(currentIdx >= finalQuestions.length) return finish();
        const data = finalQuestions[currentIdx];
        document.getElementById('q-counter').innerText = `سؤال ${currentIdx+1} من ${finalQuestions.length}`;
        document.getElementById('q-type-label').innerText = data.t;
        document.getElementById('question-text').innerText = data.q;
        document.getElementById('next-btn').classList.add('hidden');
        const box = document.getElementById('options-area'); box.innerHTML = '';

        [...data.opts].sort(() => Math.random() - 0.5).forEach(o => {
            const d = document.createElement('div'); d.className = 'opt'; d.innerText = o;
            d.onclick = () => {
                clearInterval(timer);
                const isCorrect = (o === data.ans);
                if(isCorrect) userScore++;
                
                studentAnswers.push({
                    qText: data.q,
                    studentAns: o,
                    correctAns: data.ans,
                    isCorrect: isCorrect,
                    type: data.t
                });

                document.querySelectorAll('.opt').forEach(el => {
                    el.onclick = null;
                    if(el.innerText === data.ans) el.classList.add('correct');
                    else if(el.innerText === o) el.classList.add('wrong');
                });
                document.getElementById('next-btn').classList.remove('hidden');
            };
            box.appendChild(d);
        });
        startTimer();
    }

    function startTimer() {
        let s = 45; document.getElementById('timer').innerText = s;
        clearInterval(timer);
        timer = setInterval(() => {
            s--; document.getElementById('timer').innerText = s;
            if(s<=0) { clearInterval(timer); nextQuestion(); }
        }, 1000);
    }

    function nextQuestion() { currentIdx++; loadQuestion(); }

    async function finish() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');

        const sections = { tan:0, ekm:0, syq:0, st:0, mfr:0, art:0, ikh:0 };
        const map = { "تناظر لفظي":"tan", "إكمال الجمل":"ekm", "الخطأ السياقي":"syq", "المفردة الشاذة":"mfr", "الارتباط والاختلاف":"art" };

        Object.keys(map).forEach(key => {
            const qInType = studentAnswers.filter(a => a.type === key);
            if(qInType.length > 0) {
                const correct = qInType.filter(a => a.isCorrect).length;
                sections[map[key]] = Math.round((correct / qInType.length) * 100);
            }
        });

        await db.collection("student_results").add({ 
            name: sName, email: sEmail, score: userScore, total: finalQuestions.length, 
            model_id: currentModelId, sections: sections, answers: studentAnswers, 
            time: firebase.firestore.FieldValue.serverTimestamp() 
        });

        document.getElementById('final-greeting').innerHTML = `بارك الله فيك يا ${sName} ✨`;
        document.getElementById('score-text').innerText = `${userScore} / ${finalQuestions.length}`;
    }
</script>
</body>
</html>
