<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي القدرات اللفظي - أ/ عبدالعزيز الفيفي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { 
            --main-color: #2c3e50; 
            --bg-color: #f4f7f6; 
            --white: #ffffff; 
            --correct: #27ae60; 
            --wrong: #e74c3c;
            --passage-bg: rgba(0,0,0,0.03);
            --blue-glow: rgba(52, 152, 219, 0.3);
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; padding: 20px; margin: 0; user-select: none; }
        
        /* ثيم النبض المتطابق مع طلبك */
        @keyframes pulse-blue { 
            0% { transform: scale(1); box-shadow: 0 4px 10px rgba(0,0,0,0.05); } 
            50% { transform: scale(1.03); box-shadow: 0 0 15px var(--blue-glow); border-color: #3498db; } 
            100% { transform: scale(1); box-shadow: 0 4px 10px rgba(0,0,0,0.05); } 
        }

        .quiz-card { background: var(--white); width: 100%; max-width: 900px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-top: 15px solid var(--main-color); padding: 35px; position: relative; }
        .header { text-align: center; border-bottom: 2px solid #f0f0f0; margin-bottom: 25px; padding-bottom: 15px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 15px 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        
        .q-type-badge { background: var(--main-color); color: white; padding: 10px 25px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; }
        .q-text { font-size: 1.7rem; font-weight: bold; text-align: center; line-height: 1.8; color: #1e293b; padding: 15px; }
        
        .reading-passage { background-color: var(--passage-bg); border-right: 8px solid var(--main-color); padding: 25px; margin: 20px 0; border-radius: 12px; text-align: justify; font-size: 1.25rem; line-height: 2; color: #334155; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .opt { 
            padding: 22px; border: 2px solid #e2e8f0; border-radius: 15px; cursor: pointer; 
            text-align: center; font-size: 1.35rem; background: #fff; transition: all 0.3s ease; 
            color: #334155; font-weight: 600; animation: pulse-blue 3s infinite ease-in-out;
        }
        .opt:hover { border-color: #3498db; background: #f0f9ff; }
        
        .correct { background: var(--correct) !important; color: white !important; border-color: var(--correct) !important; animation: none !important; }
        .wrong { background: var(--wrong) !important; color: white !important; border-color: var(--wrong) !important; animation: none !important; }
        
        .btn { background: var(--main-color); color: white; padding: 16px 60px; border: none; border-radius: 12px; cursor: pointer; font-size: 1.2rem; font-weight: bold; transition: 0.3s; }
        .hidden { display: none !important; }
        input { width: 85%; padding: 18px; border-radius: 12px; border: 2px solid #e2e8f0; margin-bottom: 20px; text-align: center; font-size: 1.2rem; }

        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h3>ثانوية الأمير عبدالمجيد 🎓</h3>
        <h4>أ / عبدالعزيز الفيفي ✨</h4>
    </div>

    <div id="lock-screen" class="hidden" style="text-align: center; padding: 50px 20px;">
        <div style="font-size: 5rem; margin-bottom: 20px;">🔒</div>
        <h2 style="color: var(--wrong);">محاولة دخول مكررة</h2>
        <p id="lock-message" style="font-size: 1.4rem; color: #64748b;"></p>
        <button class="btn" onclick="location.reload()" style="margin-top: 25px;">العودة</button>
    </div>

    <div id="start-page" style="text-align: center;">
        <p style="font-size: 1.2rem; margin-bottom: 20px;">أدخل إيميل منصة مدرستي لبدء التحدي</p>
        <input type="email" id="studentEmail" placeholder="sxxxxxxx@rb.moe.gov.sa">
        <br>
        <button class="btn" onclick="verifyAndStart()">دخول المنصة 🚀</button>
        <p id="status-msg" style="margin-top: 20px; font-weight: bold;"></p>
    </div>

    <div id="quiz-page" class="hidden">
        <div class="nav-bar">
            <div id="q-counter" style="font-weight: 800;"></div>
            <div id="challenger-display" style="font-weight: 800; color: var(--main-color);"></div> 
            <div id="timer" style="font-weight: 900; font-size: 1.8rem; color: var(--wrong);">45</div>
        </div>
        <div style="text-align: right; margin-bottom: 15px;">
            <span id="q-type-label" class="q-type-badge"></span>
        </div>
        <div id="question-text" class="q-text"></div>
        <div id="options-area" class="options-grid"></div>
        <div style="text-align: center; margin-top: 40px;">
            <button id="next-btn" class="btn hidden" onclick="nextQuestion()">السؤال التالي ⮕</button>
        </div>
    </div>

    <div id="result-page" class="hidden" style="text-align: center;">
        <h2 id="final-greeting"></h2>
        <div style="font-size: 6rem; font-weight: 900; margin: 30px 0; color: var(--main-color);" id="score-text"></div>
        <button class="btn" onclick="location.reload()">خروج</button>
    </div>
</div>

<script>
    const rawQuizData = [
    // --- التناظر اللفظي (10 أسئلة) ---
    { t: "التناظر اللفظي", q: "غرفة : فندق", opts: ["غصن : شجرة", "شارع : مدينة", "وجه : أنف", "بحر : سمك"], ans: "غصن : شجرة" },
    { t: "التناظر اللفظي", q: "رمل : زجاج", opts: ["خشب : ورق", "حديد : مغناطيس", "ماء : ثلج", "نار : دخان"], ans: "خشب : ورق" },
    { t: "التناظر اللفظي", q: "دقيقة : ساعة", opts: ["يوم : أسبوع", "ثانية : دقيقة", "شهر : سنة", "قرن : عام"], ans: "ثانية : دقيقة" },
    { t: "التناظر اللفظي", q: "منحل : عسل", opts: ["مزرعة : ثمار", "حقل : قمح", "فرن : خبز", "بحر : لؤلؤ"], ans: "فرن : خبز" },
    { t: "التناظر اللفظي", q: "مهندس : خريطة", opts: ["طبيب : مستشفى", "محام : قضية", "خياط : قماش", "رسام : لوحة"], ans: "رسام : لوحة" },
    { t: "التناظر اللفظي", q: "عجين : خبز", opts: ["ماء : ثلج", "نواة : تمر", "خشب : كرسي", "بذرة : شجرة"], ans: "خشب : كرسي" },
    { t: "التناظر اللفظي", q: "منار : إرشاد", opts: ["مفتاح : غلق", "ساعة : وقت", "بوصلة : اتجاه", "قلم : كتابة"], ans: "بوصلة : اتجاه" },
    { t: "التناظر اللفظي", q: "اجتهاد : نجاح", opts: ["ركض : تعب", "ألم : مرض", "نوم : ليل", "سفر : حقيبة"], ans: "ركض : تعب" },
    { t: "التناظر اللفظي", q: "غزال : رشاقة", opts: ["أسد : قوة", "ثعلب : مكر", "جمل : صبر", "نملة : نظام"], ans: "ثعلب : مكر" },
    { t: "التناظر اللفظي", q: "مشرط : جراح", opts: ["قلم : كاتب", "منشار : خشب", "طائرة : طيار", "مقص : قماش"], ans: "قلم : كاتب" },

    // --- إكمال الجمل (10 أسئلة) ---
    { t: "إكمال الجمل", q: "المتوكل هو الذي ...... بالأسباب و...... على رب الأرباب.", opts: ["يأخذ - يتوكل", "يترك - يعتمد", "ينسى - يرضى", "يهمل - يثق"], ans: "يأخذ - يتوكل" },
    { t: "إكمال الجمل", q: "من وعظ أخاه ...... فقد زانه، ومن وعظه ...... فقد شانه.", opts: ["سراً - علانية", "جهراً - سراً", "دائماً - يوماً", "بأدب - بغلظة"], ans: "سراً - علانية" },
    { t: "إكمال الجمل", q: "إذا كنت تحب الصعود فلا بد أن ...... عن ذرات ...... .", opts: ["تتخلى - الغرور", "تبحث - النجاح", "تدافع - الكرامة", "تتحدث - الفخر"], ans: "تتخلى - الغرور" },
    { t: "إكمال الجمل", q: "الكلمة الطيبة ...... للأبواب المغلقة، و...... للقلوب القاسية.", opts: ["مفتاح - بلسم", "قفل - وجع", "طريق - جدار", "حل - ألم"], ans: "مفتاح - بلسم" },
    { t: "إكمال الجمل", q: "الكتب هي ...... التي نطل من خلالها على ...... الآخرين.", opts: ["النوافذ - عقول", "الأبواب - بيوت", "المرآة - وجوه", "المصابيح - طرق"], ans: "النوافذ - عقول" },
    { t: "إكمال الجمل", q: "إذا أردت أن تعلو فوق الناس فضع نفسك ...... ، وإذا أردت أن تقودهم فسر ...... .", opts: ["أسفل منهم - خلفهم", "أمامهم - بجانبهم", "خلفهم - معهم", "فوقهم - أمامهم"], ans: "أسفل منهم - خلفهم" },
    { t: "إكمال الجمل", q: "عظمة عقلك تخلق لك ...... ، وعظمة قلبك تخلق لك ...... .", opts: ["الحساد - المحبين", "المجد - الحب", "الشهرة - المودة", "الأعداء - الأصدقاء"], ans: "الحساد - المحبين" },
    { t: "إكمال الجمل", q: "من ...... في عمله ساد، ومن ...... في قوله قاد.", opts: ["أخلص - صدق", "أسرع - أجمل", "تعب - أطال", "اجتهد - أكثر"], ans: "أخلص - صدق" },
    { t: "إكمال الجمل", q: "الاعتذار لا يعني دائماً أنك على ...... ، بل يعني أنك تقدّر ...... أكثر من ذاتك.", opts: ["خطأ - علاقتك", "حق - كرامتك", "يقين - نفسك", "باطل - قيمتك"], ans: "خطأ - علاقتك" },
    { t: "إكمال الجمل", q: "قطرة الماء ...... الصخر، ليس بالعنف ولكن بـ ...... .", opts: ["تفتت - التكرار", "تكسر - القوة", "تذيب - الحرارة", "تثقب - الصمود"], ans: "تفتت - التكرار" },

    // --- الخطأ السياقي (8 أسئلة) ---
    { t: "الخطأ السياقي", q: "من لانت كلمته وجبت محبته، فالكلمة الفظة تفتح القلوب القاسية.", opts: ["لانت", "محبته", "الفظة", "تفتح"], ans: "تفتح" },
    { t: "الخطأ السياقي", q: "المرء الناجح هو من يغلق أذنيه عن النجاح، ويستمر في العمل الدؤوب.", opts: ["الناجح", "يغلق", "النجاح", "الدؤوب"], ans: "النجاح" },
    { t: "الخطأ السياقي", q: "الكتب هي خزائن العلم، فاحرص على إهمالها لتنال المعرفة الواسعة.", opts: ["خزائن", "احرص", "إهمالها", "المعرفة"], ans: "إهمالها" },
    { t: "الخطأ السياقي", q: "أفضل وسيلة للتغلب على الصعوبات هي الهروب منها، فالمواجهة تضعف العزيمة.", opts: ["أفضل", "الهروب", "المواجهة", "تضعف"], ans: "الهروب" },
    { t: "الخطأ السياقي", q: "إن طول التجارب في الحياة يعلمك كثرة الكلام، ويمنحك قدرة على الحكمة.", opts: ["طول", "يعلمك", "الكلام", "الحكمة"], ans: "الكلام" },
    { t: "الخطأ السياقي", q: "الرجل الصالح هو من يرى محاسن الناس ويخفي عيوبهم، ويذكر المساوئ في غيبتهم.", opts: ["الصالح", "محاسن", "عيوبهم", "المساوئ"], ans: "المساوئ" },
    { t: "الخطأ السياقي", q: "من أراد أن يطاع، فليأمر بما لا يستطاع.", opts: ["أراد", "يطاع", "فليأمر", "يستطاع"], ans: "يستطاع" },
    { t: "الخطأ السياقي", q: "نور الشمس يضيء النهار، ونور العلم يطفي القلوب.", opts: ["نور", "يضيء", "يطفي", "القلوب"], ans: "يطفي" },

    // --- المفردة الشاذة (7 أسئلة) ---
    { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["خروف", "بقرة", "ماعز", "أسد"], ans: "أسد" },
    { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["الكويت", "البحرين", "الأردن", "عمان"], ans: "الأردن" },
    { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["سبت", "أحد", "محرم", "جمعة"], ans: "محرم" },
    { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["متر", "جرام", "كيلو", "طن"], ans: "متر" },
    { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["شمال", "شرق", "فوق", "غرب"], ans: "فوق" },
    { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["فقه", "توحيد", "كيمياء", "تفسير"], ans: "كيمياء" },
    { t: "المفردة الشاذة", q: "حدد المفردة الشاذة:", opts: ["سيف", "خنجر", "رمح", "درع"], ans: "درع" },

    // --- الارتباط والاختلاف (5 أسئلة) ---
    { t: "الارتباط والاختلاف", q: "الارتباط الأقوى لـ (مكّة) هو:", opts: ["جبل", "تجارة", "كعبة", "طريق"], ans: "كعبة" },
    { t: "الارتباط والاختلاف", q: "ما الكلمة التي لا تنتمي لمجموعة (أعضاء النطق):", opts: ["لسان", "أسنان", "حلق", "أذن"], ans: "أذن" },
    { t: "الارتباط والاختلاف", q: "أي من هذه الكلمات يختلف عن البقية:", opts: ["عطارد", "المريخ", "الشمس", "المشتري"], ans: "الشمس" },
    { t: "الارتباط والاختلاف", q: "الارتباط الأقوى لـ (غابة) هو:", opts: ["خشب", "أشجار", "حيوانات", "ماء"], ans: "أشجار" },
    { t: "الارتباط والاختلاف", q: "الكلمة المرتبطة بـ (بحر) من حيث المهنة:", opts: ["قبطان", "مهندس", "طيار", "مزارع"], ans: "قبطان" }
];

    const currentModelId = "نموذج - 15"; 
    let sName, sEmail, currentIdx = 0, userScore = 0, timer, finalQuestions;
    let userAnswers = []; 

    const firebaseConfig = { 
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0", 
        authDomain: "aztlg-494c3.firebaseapp.com", 
        projectId: "aztlg-494c3", 
        storageBucket: "aztlg-494c3.firebasestorage.app", 
        messagingSenderId: "597051893949", 
        appId: "1:597051893949:web:de5554ac900317a92b2fd4" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function verifyAndStart() {
        const emailInput = document.getElementById('studentEmail').value.trim().toLowerCase();
        if(!emailInput.includes('@')) return alert("يرجى إدخال إيميل مدرستي");
        document.getElementById('status-msg').innerText = "جاري التحقق... ⏳";

        try {
            const allowedDoc = await db.collection("allowed_students").doc(emailInput).get();
            if (!allowedDoc.exists) return alert("الإيميل غير مسجل");

            sName = allowedDoc.data().name;
            sEmail = emailInput;

            const resultCheck = await db.collection("student_results")
                .where("email", "==", sEmail)
                .where("model_id", "==", currentModelId).get();

            if (!resultCheck.empty) {
                document.getElementById('start-page').classList.add('hidden');
                document.getElementById('lock-screen').classList.remove('hidden');
                document.getElementById('lock-message').innerText = `يا ${sName}، لقد أديت هذا الاختبار مسبقاً.`;
                return;
            }

            document.getElementById('challenger-display').innerText = `المتحدي: ${sName}`;
            finalQuestions = [...rawQuizData].sort(() => Math.random() - 0.5);
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            loadQuestion();
        } catch (e) { alert("خطأ في الاتصال."); }
    }

    function loadQuestion() {
        if(currentIdx >= finalQuestions.length) return finish();
        const data = finalQuestions[currentIdx];
        document.getElementById('q-counter').innerText = `سؤال ${currentIdx+1} / ${finalQuestions.length}`;
        document.getElementById('q-type-label').innerText = data.t;
        document.getElementById('question-text').innerHTML = data.q;
        document.getElementById('next-btn').classList.add('hidden');
        
        const box = document.getElementById('options-area'); box.innerHTML = '';
        [...data.opts].sort(() => Math.random() - 0.5).forEach(o => {
            const d = document.createElement('div'); d.className = 'opt'; d.innerText = o;
            d.onclick = () => {
                clearInterval(timer);
                const isCorrect = (o === data.ans);
                if(isCorrect) userScore++;
                userAnswers.push({
                    qText: data.q.replace(/<[^>]*>?/gm, '').substring(0, 60),
                    qType: data.t, studentAns: o, correctAns: data.ans, isCorrect: isCorrect
                });
                document.querySelectorAll('.opt').forEach(el => {
                    el.onclick = null; el.style.animation = "none";
                    if(el.innerText === data.ans) el.classList.add('correct');
                    else if(el.innerText === o) el.classList.add('wrong');
                });
                document.getElementById('next-btn').classList.remove('hidden');
            };
            box.appendChild(d);
        });
        startTimer();
    }

    function startTimer() {
        let s = 45; document.getElementById('timer').innerText = s;
        clearInterval(timer);
        timer = setInterval(() => {
            s--; document.getElementById('timer').innerText = s;
            if(s<=0) { 
                clearInterval(timer); 
                userAnswers.push({ qText: "لم يجب", studentAns: "وقت", correctAns: finalQuestions[currentIdx].ans, isCorrect: false });
                nextQuestion(); 
            }
        }, 1000);
    }

    function nextQuestion() { currentIdx++; loadQuestion(); }

    async function finish() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');
        document.getElementById('final-greeting').innerHTML = `عمل رائع يا <b>${sName}</b>! 💐`;
        document.getElementById('score-text').innerText = `${userScore} / ${finalQuestions.length}`;
        await db.collection("student_results").add({ 
            name: sName, email: sEmail, score: userScore, total: finalQuestions.length, 
            model_id: currentModelId, answers: userAnswers,
            time: firebase.firestore.FieldValue.serverTimestamp() 
        });
    }
</script>
</body>
</html>
